name: scopesentry-jp
services:
  scan:
    image: scopesentry-scan-jp:1.9.20-ec7eaa34-20261124
    pull_policy: never
    container_name: scopesentry-scan
    hostname: node-jp-01
    network_mode: host
    init: true
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 2048
    shm_size: 1g
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      TZ: Asia/Shanghai
      GOMAXPROCS: "4"
      GOMEMLIMIT: 8GiB
      NCC_BATCH: "10"
      NCC_CONC: "2"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "127.0.0.1,localhost,100.115.186.92,100.65.237.20"
    volumes:
      - ./config:/apps/config
      - ./data:/apps/data
      - ./state/redis.json:/run/secrets/redis.json:ro
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/scopesentry-healthcheck.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15m
