name: scopesentry-jp
services:
  scan:
    image: scopesentry-scan-jp:1.9.20-p7a84e2d2-20261124
    pull_policy: never
    container_name: scopesentry-scan
    hostname: node-jp-01
    network_mode: host
    init: true
    restart: unless-stopped
    # 8 核实测只用 39%，4 核限额下 30 秒被节流 25 秒；提到 6 核后降到 7 秒。
    # 留 2 核给 docker/ssh/tailscale/系统。
    cpus: "6.0"
    mem_limit: 16g
    memswap_limit: 16g
    pids_limit: 2048
    shm_size: 1g
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      TZ: Asia/Shanghai
      # 与 cpus 对齐：Go 1.24 不读 cgroup 的 CPU 限额，GOMAXPROCS 必须显式给，
      # 否则限额提到 6 核而 Go 仍按 4 线程调度，多出来的配额用不上。
      GOMAXPROCS: "6"
      # 约为 mem_limit 的 70%，留给 chrome/katana 等子进程。
      GOMEMLIMIT: 11GiB
      # 批大小直接决定 nuclei 每个目标要起多少个引擎：10 → 1428 批，实测单目标 45 分钟；
      # 1000 → 15 批，按代码注释「单批 1000 模板约 1 分钟」约 5 分钟。
      # 2026-11-24 之前的 10 是做烟测时临时调的，忘了改回来，成了吞吐瓶颈。
      NCC_BATCH: "1000"
      NCC_CONC: "3"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "127.0.0.1,localhost,100.115.186.92,100.65.237.20"
    volumes:
      - ./config:/apps/config
      - ./data:/apps/data
      - ./state/redis.json:/run/secrets/redis.json:ro
      # 模板与字典必须挂出来：它们在容器可写层里，每重建一次就要从 Mongo 重新拉 39 MB，
      # 走 Tailscale 要 5–15 分钟，期间节点不注册、不接任务（2026-11-24 实测）。
      - ./poc:/apps/poc
      - ./dictionaries:/apps/dictionaries
      # 健康检查脚本挂载而非烤进镜像：容器里是 Python 3.7，
      # 上一版用了 3.9+ 的 zoneinfo，导致健康检查从未成功过（FailingStreak 38）。
      - ./state/healthcheck.py:/usr/local/libexec/scopesentry-healthcheck.py:ro
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/scopesentry-healthcheck.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15m